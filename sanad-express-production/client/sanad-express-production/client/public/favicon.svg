      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#0891b2"/>
